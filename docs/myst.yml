# MyST v2 Configuration
version: 1

project:
  title: AEA Data Editor Editor Scripts Documentation
  description: Reference for the scripts that support the AEA Data Editor workflow
  authors:
    - name: AEA Data Editor Team
  github: https://github.com/AEADataEditor/editor-scripts
  license: CC-BY-4.0
  exclude:
    - superpowers/**
  index: index.md
  toc:
    - file: index.md
      title: Home
    - file: installation/index.md
      title: Installation
    - file: python-commands/index.md
      title: Python commands
      children:
        - file: python-commands/aea-box-clean-folders.md
        - file: python-commands/aea-box-recover-files.md
        - file: python-commands/aea-parse-tags.md
        - file: python-commands/aeagit.md
        - file: python-commands/aeagit-create.md
        - file: python-commands/jira-approval-manager.md
        - file: python-commands/jira-openicpsr-changes.md
        - file: python-commands/jira-purge-query.md
        - file: python-commands/jira-reason-sync.md
        - file: python-commands/jira-status-manager.md
        - file: python-commands/zenodo-metadata-editor.md
    - file: scripts/index.md
      title: Scripts
      children:
        - file: scripts/aeaclean.md
        - file: scripts/aeamerge.md
        - file: scripts/aeaopen.md
        - file: scripts/aeaready.md
        - file: scripts/aearevision.md
        - file: scripts/icpsrsearch.md
        - file: scripts/jira_workflow_cleanup.md
        - file: scripts/stata.md
        - file: scripts/system-info.md

site:
  template: book-theme
  title: AEA Editor Scripts
  options:
    logo_text: AEA Data Editor
    folders: true
